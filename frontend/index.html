<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo App</title>
</head>

<body>

<h1>Todo App</h1>

<!-- ==================== -->
<!-- 新規登録 -->
<!-- ==================== -->
<section>
    <h2>新規登録</h2>

    <input id="register-username" placeholder="username" autocomplete="username">
    <input id="register-password" type="password" placeholder="password" autocomplete="new-password">
    <button onclick="register()">登録</button>
</section>

<hr>

<!-- ==================== -->
<!-- ログイン -->
<!-- ==================== -->
<section>
    <h2>ログイン</h2>

    <input id="username" placeholder="username" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button onclick="login()">ログイン</button>
    <button id="logout-button" onclick="logout()" hidden>ログアウト</button>
</section>

<hr>

<!-- ==================== -->
<!-- Todo追加 -->
<!-- ==================== -->
<section>
    <h2>Todo追加</h2>

    <input id="task" placeholder="task" maxlength="200">
    <input id="due-date" type="datetime-local">
    <input id="priority" type="number" min="1" max="3" placeholder="priority (1-3)">
    <button onclick="addTodo()">追加</button>
</section>

<hr>

<!-- ==================== -->
<!-- Todo一覧 -->
<!-- ==================== -->
<section>
    <h2>Todo一覧</h2>

    <label for="done-filter">状態：</label>
    <select id="done-filter">
        <option value="">すべて</option>
        <option value="false">未完了</option>
        <option value="true">完了</option>
    </select>

    <label for="priority-filter">優先度：</label>
    <select id="priority-filter">
        <option value="">すべて</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
    </select>

    <label for="sort-by">並び順：</label>
    <select id="sort-by">
        <option value="">指定なし</option>
        <option value="created">作成日時</option>
        <option value="due">期限</option>
    </select>

    <button onclick="resetPageAndGetTodos()">更新</button>

    <ul id="todo-list"></ul>

    <!-- ページネーション -->
    <div>
        <button id="prev-button" onclick="previousPage()">← 前へ</button>
        <span id="page-number">1</span>
        <button id="next-button" onclick="nextPage()">次へ →</button>
    </div>
</section>

<script src="app.js"></script>

</body>
</html>
